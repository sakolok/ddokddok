AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Elder Voice Companion - Serverless Backend (Python)

Globals:
  Function:
    Runtime: python3.14
    Timeout: 15
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        SESSIONS_TABLE: !Ref SessionsTable
        TURNS_TABLE: !Ref TurnsTable
        KDSQ_RESPONSES_TABLE: !Ref KdsqResponsesTable
        SELF_ASSESSMENTS_TABLE: !Ref SelfAssessmentsTable
        ACTIVITY_TABLE: !Ref ActivityTable
        POLLY_BUCKET: !Ref PollyBucket
        POLLY_VOICE_ID: "Seoyeon"
        POLLY_ENGINE: "generative"
        POLLY_FALLBACK_ENGINES: "neural,standard"
        ANALYSIS_QUEUE_URL: !Ref AnalysisQueue
        SNS_TOPIC_ARN: !Ref GuardianAlertsTopic
        USER_POOL_ID: !Ref UserPool
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_FALLBACK_MODEL_ID: "apac.amazon.nova-lite-v1:0"
        KNOWLEDGE_BASE_ID: !If
          - HasKnowledgeBaseId
          - !Ref KnowledgeBaseId
          - !Ref CareGuideKnowledgeBase
        KNOWLEDGE_BASE_MAX_RESULTS: !Ref KnowledgeBaseMaxResults
        KNOWLEDGE_BASE_MIN_SCORE: !Ref KnowledgeBaseMinScore
        MOCK_LLM: "false"
        NOTIFY_SCORE_THRESHOLD: "6"
        SELF_ASSESSMENT_NOTIFY_THRESHOLD: "6"
        PROMPT_VERSION: "elder-companion-v3"
        KDSQ_MIN_TURNS_BEFORE_FIRST: "5"
        KDSQ_TURN_INTERVAL: "8"
        KDSQ_DAILY_LIMIT: "3"
        TRANSCRIBE_LANGUAGE_CODE: "ko-KR"
        TRANSCRIBE_POLL_SECONDS: "22"
        TRANSCRIBE_MAX_AUDIO_BYTES: "6291456"
        TRANSCRIBE_STREAM_SAMPLE_RATE: "16000"
        TRANSCRIBE_STREAM_URL_EXPIRES: "300"
        METRICS_NAMESPACE: "ElderVoiceCompanion"
        STAGE: !Ref Stage
        LOG_LEVEL: "INFO"

Parameters:
  Stage:
    Type: String
    Default: dev
  BedrockModelId:
    Type: String
    Default: "apac.amazon.nova-lite-v1:0"
    Description: Bedrock model ID or inference profile ID used by Lambda runtime.
  BedrockInvokeResourceArn:
    Type: String
    Default: "*"
    Description: IAM resource ARN for bedrock:InvokeModel. Set to a model or inference-profile ARN for stricter production least privilege.
  KnowledgeBaseId:
    Type: String
    Default: ""
    Description: Optional external Bedrock Knowledge Base ID. Leave empty to use the project-managed care guide knowledge base.
  KnowledgeBaseMaxResults:
    Type: Number
    Default: 3
    Description: Maximum number of Knowledge Base retrieval results passed to the model.
  KnowledgeBaseMinScore:
    Type: String
    Default: "0.35"
    Description: Minimum Knowledge Base retrieval score to pass into the model prompt.
  OpsAlertEmail:
    Type: String
    Default: ""
    Description: Optional email address for operational alarms and budget notifications.
  MonthlyBudgetLimit:
    Type: Number
    Default: 20
    Description: Optional monthly AWS cost budget in USD, created only when OpsAlertEmail is set.

Conditions:
  HasOpsAlertEmail: !Not [!Equals [!Ref OpsAlertEmail, ""]]
  HasKnowledgeBaseId: !Not [!Equals [!Ref KnowledgeBaseId, ""]]

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'OPTIONS,POST,GET'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'OPTIONS,POST,GET'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'OPTIONS,POST,GET'"

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: guardian_email
          AttributeType: S
        - AttributeName: cognito_username
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: guardian_email_index
          KeySchema:
            - AttributeName: guardian_email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: cognito_username_index
          KeySchema:
            - AttributeName: cognito_username
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_id_index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TurnsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  KdsqResponsesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  SelfAssessmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: assessment_date
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: assessment_date
          KeyType: RANGE

  ActivityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  PollyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "elder-voice-companion-polly-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpirePollyAudio
            Prefix: polly/
            Status: Enabled
            ExpirationInDays: 7
          - Id: ExpireTranscribeInput
            Prefix: transcribe-input/
            Status: Enabled
            ExpirationInDays: 1
          - Id: ExpireTranscribeOutput
            Prefix: transcribe-output/
            Status: Enabled
            ExpirationInDays: 1
      VersioningConfiguration:
        Status: Suspended

  KnowledgeBaseDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "elder-voice-companion-kb-docs-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  KnowledgeBaseVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Sub "elder-voice-companion-kb-vectors-${Stage}-${AWS::AccountId}"

  KnowledgeBaseVectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !GetAtt KnowledgeBaseVectorBucket.VectorBucketArn
      IndexName: !Sub "elder-voice-companion-kb-${Stage}"
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine

  KnowledgeBaseServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
      Policies:
        - PolicyName: KnowledgeBaseAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:ListCustomModels
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt KnowledgeBaseDocumentsBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
                  StringLike:
                    s3:prefix:
                      - care-guides/
                      - care-guides/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${KnowledgeBaseDocumentsBucket.Arn}/care-guides/*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Effect: Allow
                Action:
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:QueryVectors
                  - s3vectors:GetIndex
                Resource: !Ref KnowledgeBaseVectorIndex

  KnowledgeBaseVectorBucketPolicy:
    Type: AWS::S3Vectors::VectorBucketPolicy
    Properties:
      VectorBucketArn: !GetAtt KnowledgeBaseVectorBucket.VectorBucketArn
      Policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt KnowledgeBaseServiceRole.Arn
            Action:
              - s3vectors:PutVectors
              - s3vectors:GetVectors
              - s3vectors:DeleteVectors
              - s3vectors:QueryVectors
              - s3vectors:GetIndex
            Resource: !Ref KnowledgeBaseVectorIndex

  CareGuideKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn: KnowledgeBaseVectorBucketPolicy
    Properties:
      Name: !Sub "elder_voice_companion_kb_${Stage}"
      Description: "KDSQ, self-assessment, guardian alert, and service guide knowledge base."
      RoleArn: !GetAtt KnowledgeBaseServiceRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration:
              Dimensions: 1024
              EmbeddingDataType: FLOAT32
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          IndexArn: !Ref KnowledgeBaseVectorIndex

  CareGuideDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref CareGuideKnowledgeBase
      Name: !Sub "elder_voice_companion_docs_${Stage}"
      Description: "Project care guide documents for selective RAG."
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt KnowledgeBaseDocumentsBucket.Arn
          InclusionPrefixes:
            - care-guides/

  AnalysisDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  AnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalysisDeadLetterQueue.Arn
        maxReceiveCount: 3

  GuardianAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: "Elder Voice Companion Alerts"

  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: "Elder Voice Companion Ops Alerts"

  OpsAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasOpsAlertEmail
    Properties:
      TopicArn: !Ref OpsAlertsTopic
      Protocol: email
      Endpoint: !Ref OpsAlertEmail

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: elder-voice-companion-user-pool
      UsernameAttributes: []
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: guardian_email
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false
      Policies:
        PasswordPolicy:
          MinimumLength: 6
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      AutoVerifiedAttributes: []

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: elder-voice-companion-client
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  StartFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.start.handler
      Timeout: 25
      MemorySize: 1024
      Events:
        Start:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /start
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - S3WritePolicy:
            BucketName: !Ref PollyBucket
        - S3ReadPolicy:
            BucketName: !Ref PollyBucket
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: "ElderVoiceCompanion"

  TurnFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.turn.handler
      Timeout: 25
      MemorySize: 1024
      Events:
        Turn:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /turn
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TurnsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref KdsqResponsesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - S3WritePolicy:
            BucketName: !Ref PollyBucket
        - S3ReadPolicy:
            BucketName: !Ref PollyBucket
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Ref BedrockInvokeResourceArn
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !GetAtt CareGuideKnowledgeBase.KnowledgeBaseArn
            - !If
              - HasKnowledgeBaseId
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
              - !Ref AWS::NoValue
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: "ElderVoiceCompanion"

  TranscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.transcribe.handler
      Timeout: 28
      MemorySize: 1024
      Events:
        Transcribe:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /transcribe
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub "${PollyBucket.Arn}/transcribe-input/*"
                - !Sub "${PollyBucket.Arn}/transcribe-output/*"
            - Effect: Allow
              Action:
                - s3:GetBucketLocation
              Resource: !GetAtt PollyBucket.Arn
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
              Resource: !Sub "arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/elder-voice-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: "ElderVoiceCompanion"

  TranscribeStreamUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.transcribe_stream_url.handler
      Timeout: 10
      MemorySize: 512
      Events:
        TranscribeStreamUrl:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /transcribe/stream-url
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:StartStreamTranscriptionWebSocket
              Resource: "*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: "ElderVoiceCompanion"

  SessionEndFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.session_end.handler
      Events:
        SessionEnd:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /session/end
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AnalysisQueue.QueueName

  AuthSignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.auth_signup.handler
      Events:
        AuthSignup:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /auth/signup
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminConfirmSignUp
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action:
                - sns:CreateTopic
              Resource: "*"
            - Effect: Allow
              Action:
                - sns:Subscribe
              Resource:
                - !Ref GuardianAlertsTopic
                - !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:elder-voice-companion-guardian-*"

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.auth_login.handler
      Events:
        AuthLogin:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /auth/login
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminConfirmSignUp
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn

  AuthGuardianVerifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.auth_guardian_verify.handler
      Events:
        AuthGuardianVerify:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /auth/guardian/verify
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  SelfAssessmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.self_assessment.handler
      Events:
        SelfAssessment:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /self-assessment
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SelfAssessmentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource:
                - !Ref GuardianAlertsTopic
                - !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:elder-voice-companion-guardian-*"

  ActivityLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.activity_log.handler
      Events:
        ActivityLog:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /activity/log
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ActivityTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  ActivityWeeklyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.activity_weekly.handler
      Events:
        ActivityWeekly:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /activity/weekly
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ActivityTable
        - DynamoDBReadPolicy:
            TableName: !Ref SelfAssessmentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref KdsqResponsesTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Ref BedrockInvokeResourceArn
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: "ElderVoiceCompanion"

  SessionsListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.sessions_list.handler
      Events:
        Sessions:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /sessions
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  SessionGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.session_get.handler
      Events:
        SessionGet:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /sessions/{session_id}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TurnsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  AnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: lambdas.analysis.handler
      Timeout: 60
      MemorySize: 1024
      Events:
        AnalysisEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalysisQueue.Arn
            BatchSize: 1
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TurnsTable
        - DynamoDBReadPolicy:
            TableName: !Ref KdsqResponsesTable
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Ref BedrockInvokeResourceArn
            - Effect: Allow
              Action:
                - sns:Publish
              Resource:
                - !Ref GuardianAlertsTopic
                - !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:elder-voice-companion-guardian-*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: "ElderVoiceCompanion"

  TurnFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Turn Lambda error count is above zero."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TurnFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  TurnFunctionDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Turn Lambda average duration is close to timeout."
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref TurnFunction
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 20000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  TranscribeFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Transcribe Lambda error count is above zero."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TranscribeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  TranscribeStreamUrlFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Transcribe streaming URL Lambda error count is above zero."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TranscribeStreamUrlFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  AnalysisDlqVisibleMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Analysis DLQ has messages requiring manual review."
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AnalysisDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  ModelFallbackAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Bedrock model fallback was used."
      Namespace: ElderVoiceCompanion
      MetricName: ModelFallback
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  PollyFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Polly synthesis failed after fallback attempts."
      Namespace: ElderVoiceCompanion
      MetricName: PollySynthesisFailure
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  TranscribeFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "AWS Transcribe conversion failed or timed out."
      Namespace: ElderVoiceCompanion
      MetricName: TranscribeFailure
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  KnowledgeBaseRetrieveFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Bedrock Knowledge Base retrieval failed."
      Namespace: ElderVoiceCompanion
      MetricName: KnowledgeBaseRetrieveFailure
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic

  ElderVoiceDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "elder-voice-companion-${Stage}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "region": "${AWS::Region}",
                "title": "Conversation Lambda Errors and Duration",
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${TurnFunction}", { "stat": "Sum" } ],
                  [ ".", "Duration", ".", ".", { "stat": "Average", "yAxis": "right" } ],
                  [ ".", "Errors", ".", "${TranscribeFunction}", { "stat": "Sum" } ],
                  [ ".", "Duration", ".", ".", { "stat": "Average", "yAxis": "right" } ],
                  [ ".", "Errors", ".", "${TranscribeStreamUrlFunction}", { "stat": "Sum" } ]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "region": "${AWS::Region}",
                "title": "AI and Voice Fallbacks",
                "metrics": [
                  [ "ElderVoiceCompanion", "ModelFallback", "Stage", "${Stage}", { "stat": "Sum" } ],
                  [ ".", "BedrockInvokeError", ".", ".", { "stat": "Sum" } ],
                  [ ".", "PollySynthesisFailure", ".", ".", { "stat": "Sum" } ],
                  [ ".", "PollyFallbackEngine", ".", ".", { "stat": "Sum" } ],
                  [ ".", "TranscribeFailure", ".", ".", { "stat": "Sum" } ],
                  [ ".", "TranscribeSuccess", ".", ".", { "stat": "Sum" } ],
                  [ ".", "TranscribeStreamUrlIssued", ".", ".", { "stat": "Sum" } ],
                  [ ".", "KnowledgeBaseRetrieveSuccess", ".", ".", { "stat": "Sum" } ],
                  [ ".", "KnowledgeBaseRetrieveEmpty", ".", ".", { "stat": "Sum" } ],
                  [ ".", "KnowledgeBaseRetrieveFailure", ".", ".", { "stat": "Sum" } ]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "region": "${AWS::Region}",
                "title": "Analysis Queue and DLQ",
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${AnalysisQueue.QueueName}", { "stat": "Sum" } ],
                  [ ".", ".", ".", "${AnalysisDeadLetterQueue.QueueName}", { "stat": "Sum" } ]
                ],
                "period": 300
              }
            }
          ]
        }

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasOpsAlertEmail
    Properties:
      Budget:
        BudgetName: !Sub "elder-voice-companion-${Stage}-monthly"
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimit
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref OpsAlertEmail

Outputs:
  ApiUrl:
    Description: API endpoint
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UserPoolId:
    Description: Cognito user pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito user pool app client id
    Value: !Ref UserPoolClient
  CloudWatchDashboard:
    Description: CloudWatch operational dashboard
    Value: !Sub "elder-voice-companion-${Stage}"
  ProjectKnowledgeBaseId:
    Description: Project-managed Bedrock Knowledge Base ID
    Value: !Ref CareGuideKnowledgeBase
  ProjectKnowledgeBaseDataSourceId:
    Description: Project-managed Bedrock Knowledge Base data source ID
    Value: !GetAtt CareGuideDataSource.DataSourceId
  KnowledgeBaseDocumentsBucket:
    Description: S3 bucket for Knowledge Base source documents
    Value: !Ref KnowledgeBaseDocumentsBucket
  KnowledgeBaseVectorBucketArn:
    Description: S3 Vectors bucket ARN
    Value: !GetAtt KnowledgeBaseVectorBucket.VectorBucketArn
  KnowledgeBaseVectorIndexArn:
    Description: S3 Vectors index ARN
    Value: !Ref KnowledgeBaseVectorIndex
