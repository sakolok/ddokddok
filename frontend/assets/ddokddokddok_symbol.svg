<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 하트 = 돌봄/케어, 그 안의 음성 웨이브 = 목소리를 듣고 있다는 것. 둘을 합치면 '음성 케어'가 한눈에 읽힘 -->
  <path d="M150,258
           C150,258 42,182 42,112
           C42,72 76,46 111,46
           C132,46 146,57 150,76
           C154,57 168,46 189,46
           C224,46 258,72 258,112
           C258,182 150,258 150,258 Z"
        fill="#F2705C"/>

  <!-- 심장 안의 음성 파형 (짧은-김-짧은 리듬으로 '듣고 있음'을 표현) -->
  <rect x="92"  y="140" width="15" height="40"  rx="7.5" fill="#FBF6EE"/>
  <rect x="117" y="115" width="15" height="90"  rx="7.5" fill="#FBF6EE"/>
  <rect x="142" y="95"  width="15" height="130" rx="7.5" fill="#FBF6EE"/>
  <rect x="167" y="115" width="15" height="90"  rx="7.5" fill="#FBF6EE"/>
  <rect x="192" y="140" width="15" height="40"  rx="7.5" fill="#FBF6EE"/>
</svg>
